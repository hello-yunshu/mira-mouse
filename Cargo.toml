# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = [
  "crates/mira-core",
  "crates/mira-protocol",
  "crates/mira-plugin-api",
  "crates/mira-plugin-runtime",
  "crates/mira-plugin-cli",
  "crates/mira-local-ai",
  "crates/mira-testkit",
  "src-tauri",
  "xtask",
]
exclude = [
  "handlers/mira-battery-handler",
]

[workspace.package]
version = "1.2.7"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.23", features = ["derive"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
semver = { version = "1.0.24", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
sha2 = "0.10.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# rill 版本按 major.minor 声明（允许后续兼容升级），实际可复现版本由
# 提交的 Cargo.lock 保证；升级通过独立依赖 PR + 更新锁文件完成，禁止在
# release 构建中运行无约束 `cargo update`。
# `serde` feature 仅用于 rill-ml 的 FeatureSchema / ModelDescriptor 身份
# 序列化，不打开任何 Preview 能力。
# rill 1.5 采用 release-index schema v3（Linux runtime 增加 target_libc），
# 但 IPC API 仍为 v2、handler ABI 仍为 v1，Mira 继续使用这些稳定接口。
rill-runtime-protocol = "1.5"
rill-ml = { version = "1.5", default-features = false, features = ["serde"] }
tempfile = "3.14.0"
thiserror = "2.0.9"
toml = "1.1"
walkdir = "2.5.0"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
