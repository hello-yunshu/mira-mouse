name: Security
on:
  push: { branches: [main], paths: ['Cargo.lock', 'package-lock.json', 'deny.toml', '.github/workflows/**', 'crates/**', 'src/**'] }
  pull_request: { paths: ['Cargo.lock', 'package-lock.json', 'deny.toml', '.github/workflows/**', 'crates/**', 'src/**'] }
  schedule: [{ cron: '17 3 * * 1' }]
permissions: { contents: read, security-events: write }
concurrency: { group: 'security-${{ github.ref }}', cancel-in-progress: true }
jobs:
  codeql:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: 'javascript-typescript,actions' }
      - uses: github/codeql-action/analyze@v4
  rust-and-workflows:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        run: |
          set -euo pipefail
          echo "Documented audit exceptions:"
          echo "  RUSTSEC-2024-0370 proc-macro-error (Linux GTK build-time)"
          echo "  RUSTSEC-2024-0429 glib 0.18.5 (Linux GTK, waits for gtk-rs 0.20)"
          echo "  RUSTSEC-2026-0370 zvariant (Linux zbus, unmaintained upstream)"
          echo "  RUSTSEC-2026-0371 zbus_names (Linux zbus, unmaintained upstream)"
          echo "  RUSTSEC-2026-0372 zvariant_derive (Linux zbus, unmaintained upstream)"
          echo "See docs/security/audit-exceptions.md for reasons and review date."
          cargo audit \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372
      - run: node scripts/check-boundaries.mjs
